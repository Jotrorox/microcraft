name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  host-checks:
    name: Protocol tests and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable test -p microcraft-protocol --target x86_64-unknown-linux-gnu --locked
      - run: cargo +stable clippy -p microcraft-protocol --all-targets --target x86_64-unknown-linux-gnu --locked -- -D warnings
      - run: python3 scripts/check_config.py

  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: build
            args: --release --locked
          - command: clippy
            args: --all-features --workspace --locked -- -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Setup Xtensa Rust
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          buildtargets: esp32s3
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}
